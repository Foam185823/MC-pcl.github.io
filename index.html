<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的世界 · 网页联机大厅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{background:#0f0f14;color:#e8e8f0;height:100vh;overflow:hidden;user-select:none}

#mobileBlock{position:fixed;inset:0;z-index:9999999;background:#0a0a12;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;color:#fff;font-family:monospace}
#mobileBlock.show{display:flex}

#startOverlay{position:fixed;inset:0;background:#000;z-index:2000000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:30px;transition:opacity .5s}
#startOverlay.hide{opacity:0;pointer-events:none}
#startOverlay .title{font-size:48px;font-weight:900;letter-spacing:8px;background:linear-gradient(135deg,#4a6cf7,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 60px rgba(74,108,247,.5);animation:floatUp 2s ease-in-out infinite}
@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#startOverlay .startBtn{padding:18px 60px;background:linear-gradient(135deg,#3a5cdf,#4a6cf7);color:#fff;border:none;border-radius:50px;font-size:18px;font-weight:700;cursor:pointer;letter-spacing:4px;box-shadow:0 8px 32px rgba(74,108,247,.6);transition:all .3s}
#startOverlay .startBtn:hover{transform:scale(1.05);box-shadow:0 12px 48px rgba(74,108,247,.8)}

#introLayer{position:fixed;inset:0;background:#000;z-index:999999;display:none;align-items:center;justify-content:center;opacity:1;transition:opacity .8s ease}
#introLayer.active{display:flex}
#introLayer.fade-out{opacity:0;pointer-events:none}
#introVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#introSkip{position:absolute;right:24px;bottom:24px;padding:8px 18px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);border-radius:20px;color:#fff;font-size:12px;cursor:pointer;backdrop-filter:blur(8px);transition:all .2s;z-index:3;opacity:.7}
#introSkip:hover{background:rgba(0,0,0,.8);opacity:1}

#bgVideo{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:0;pointer-events:none;background:#000}
#bgMask{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(10,10,20,.08) 0%,rgba(10,10,20,.35) 100%);pointer-events:none}

#topAvatarBtn { position: fixed; right: 20px; top: 20px; z-index: 5000; display: flex; align-items: center; gap: 10px; padding: 6px 14px; background: rgba(30,32,48,.85); border: 1px solid rgba(74,108,247,.3); border-radius: 30px; cursor: pointer; backdrop-filter: blur(12px); transition: all .2s; }
#topAvatarBtn:hover { border-color: #4a6cf7; box-shadow: 0 0 16px rgba(74,108,247,.3); }
#topAvatarBtn .avatar-img { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,#4a6cf7,#a855f7); display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; }
#topAvatarBtn .avatar-img img { width: 100%; height: 100%; object-fit: cover; }
#topAvatarBtn .nick-text { font-size: 13px; font-weight: 600; color: #e8e8f0; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.panel { position: fixed; z-index: 5000; background: rgba(21,22,30,.95); backdrop-filter: blur(20px); border: 1px solid rgba(74,108,247,.3); border-radius: 14px; padding: 20px; width: 320px; display: none; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.panel.show { display: block; animation: popIn .2s cubic-bezier(.16,1,.3,1); }
@keyframes popIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
#profilePanel { right: 20px; top: 70px; transform-origin: top right; }
.panel h3 { font-size: 15px; color: #fff; margin-bottom: 16px; text-align: center; letter-spacing: 1px; }
.panel label { display: block; font-size: 12px; color: #8890a0; margin-bottom: 6px; margin-top: 12px; font-weight: 600; }
.panel input[type=text] { width:100%;background:rgba(15,15,25,.9);color:#e8e8f0;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px;font-size:14px;outline:none; }
.avatar-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.avatar-option { width: 40px; height: 40px; border-radius: 50%; background: rgba(26,28,40,.9); border: 2px solid rgba(74,108,247,.25); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all .15s; overflow: hidden; }
.avatar-option:hover { border-color: #4a6cf7; transform: scale(1.08); }
.avatar-option.selected { border-color: #4a6cf7; box-shadow: 0 0 0 3px rgba(74,108,247,.3); }
.avatar-option img { width: 100%; height: 100%; object-fit: cover; }

.app{width:100vw;height:100vh;position:relative;z-index:2;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;flex:1;padding:30px 40px;overflow-y:auto}
.screen.active{display:flex}
.home-box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;margin:auto}
.home-title{font-size:56px;font-weight:900;text-align:center;letter-spacing:6px;background:linear-gradient(135deg,#6ee7b7,#3b82f6,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:30px}
.mc-btn{width:100%;padding:16px 22px;background:rgba(30,32,48,.85);color:#e8e8f0;border:2px solid rgba(59,130,246,.3);border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;transition:all .3s;letter-spacing:2px;backdrop-filter:blur(12px)}
.mc-btn:hover{transform:translateY(-2px);border-color:#3b82f6;box-shadow:0 12px 40px rgba(59,130,246,.4)}
.mc-btn.primary{background:linear-gradient(135deg,rgba(59,130,246,.9),rgba(110,231,183,.8));border-color:transparent;color:#fff}
.mc-btn.danger{background:rgba(58,28,28,.9);border-color:rgba(255,128,128,.3);color:#ff8080}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-shrink:0}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:1px;color:#fff}
.btn-icon{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#ccc;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.btn-icon:hover{background:rgba(59,130,246,.2);border-color:#3b82f6;color:#fff}
.list-container{flex:1;overflow-y:auto;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(15,15,25,.7);backdrop-filter:blur(20px);padding:12px;max-width:900px;width:100%;margin:0 auto}
.item-card{display:flex;align-items:center;padding:16px;background:rgba(255,255,255,.03);border:2px solid transparent;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.item-card:hover{background:rgba(255,255,255,.06);transform:translateX(4px)}
.item-card.selected{border-color:#3b82f6;background:rgba(59,130,246,.1);box-shadow:0 0 20px rgba(59,130,246,.15)}
.card-icon{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#6ee7b7);display:flex;align-items:center;justify-content:center;font-size:24px;margin-right:16px;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-name{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-desc{font-size:12px;color:#8890a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action-bar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.btn-sm{padding:10px 18px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#ccc;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-sm:hover:not(:disabled){background:rgba(59,130,246,.2);border-color:#3b82f6;color:#fff}
.btn-sm:disabled{opacity:.4;cursor:not-allowed}
.btn-sm.green{background:rgba(110,231,183,.1);border-color:rgba(110,231,183,.3);color:#6ee7b7}

#gameView{position:fixed;inset:0;z-index:9999998;background:#000;display:none;cursor:none}
#gameView.show{display:block}
#gameCanvas{width:100%;height:100%;display:block}

#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;pointer-events:none;z-index:10}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.8)}
#crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}

#gameHud{position:absolute;top:20px;left:20px;z-index:11;color:#fff;font-family:monospace;font-size:13px;line-height:1.8;text-shadow:0 2px 6px #000;pointer-events:none}
#gamePing{color:#6ee7b7;font-weight:700;margin-top:6px;display:none}
#gameMode{color:#ffaa00;font-weight:700}

#gameChatBox { position: absolute; left: 20px; bottom: 80px; width: 400px; height: 250px; z-index: 11; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
#gameChatHistory { display: flex; flex-direction: column; gap: 4px; overflow-y: hidden; margin-bottom: 8px; }
.chat-msg { background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; color: #fff; font-size: 14px; display: flex; align-items: center; gap: 8px; animation: fadeInOut 10s forwards; text-shadow: 1px 1px 0 #000; }
.chat-msg img { width: 24px; height: 24px; border-radius: 4px; background: #555; }
.chat-msg .name { color: #55ffff; font-weight: bold; }
@keyframes fadeInOut { 0% { opacity: 1; transform: translateX(-10px); } 10% { transform: translateX(0); } 90% { opacity: 1; } 100% { opacity: 0; } }
#gameChatInputWrap { display: none; pointer-events: auto; }
#gameChatInputWrap.show { display: block; }
#gameChatInput { width: 100%; padding: 10px; background: rgba(0,0,0,0.7); border: 2px solid #555; color: #fff; font-size: 14px; outline: none; }

#pauseMenu{position:absolute;inset:0;z-index:20;background:rgba(11,12,16,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;cursor:default}
#pauseMenu.show{display:flex}
#pauseMenu h2{color:#fff;font-size:32px;margin-bottom:20px;letter-spacing:4px;font-weight:900}
#pauseMenu button{width:320px;padding:14px;background:rgba(255,255,255,.06);color:#e8e8f0;border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:15px;cursor:pointer;transition:all .2s;font-weight:600}
#pauseMenu button:hover{background:rgba(59,130,246,.2);border-color:#3b82f6;color:#fff}

#inventoryScreen{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;cursor:default}
#inventoryScreen.show{display:flex}
.inv-panel{background:rgba(30,30,30,.95);border:4px solid #555;border-radius:8px;padding:20px;width:500px}
.inv-panel h3{text-align:center;margin-bottom:16px;color:#fff;font-size:16px}
.inv-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-bottom:12px}
.inv-slot{aspect-ratio:1;background:rgba(139,139,139,.3);border:2px solid #555;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.inv-slot:hover{border-color:#fff}
.inv-slot.selected{border-color:#fff;box-shadow:0 0 0 2px #fff}
.inv-slot img{width:80%;height:80%;object-fit:contain;image-rendering:pixelated}

#hotbar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:11;display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.5);border-radius:8px;border:2px solid rgba(255,255,255,.15)}
.hotbar-slot{width:42px;height:42px;background:rgba(30,30,30,.7);border:2px solid rgba(255,255,255,.2);border-radius:4px;display:flex;align-items:center;justify-content:center;position:relative}
.hotbar-slot.selected{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.4)}
.hotbar-slot img{width:32px;height:32px;object-fit:contain;image-rendering:pixelated}
.hotbar-slot .slot-num{position:absolute;top:1px;left:3px;font-size:10px;color:#aaa}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:600}
.modal-mask.show{display:flex}
.modal{background:rgba(21,22,30,.98);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:28px;width:460px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.modal h3{font-size:18px;color:#fff;margin-bottom:20px;font-weight:800}
.modal label{display:block;font-size:12px;color:#8890a0;margin-bottom:6px;margin-top:14px;font-weight:600}
.modal input{width:100%;background:rgba(15,15,25,.9);color:#e8e8f0;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 14px;font-size:14px;outline:none}
.modal input:focus{border-color:#3b82f6}
.modal .hint{font-size:11px;color:#666;margin-top:6px}
.modal .btn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(60px);background:rgba(30,32,48,.95);backdrop-filter:blur(12px);border:1px solid rgba(59,130,246,.3);border-radius:10px;padding:12px 24px;font-size:13px;color:#e8e8f0;opacity:0;transition:all .3s;pointer-events:none;z-index:999999;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#gamemodeSwitcher { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30; background: rgba(0,0,0,.6); border: 2px solid rgba(255,255,255,.2); padding: 20px; display: none; flex-direction: column; gap: 10px; border-radius: 8px; pointer-events: auto; cursor: default; }
#gamemodeSwitcher.show { display: flex; }
.gm-option { padding: 10px 20px; background: rgba(255,255,255,.1); color: #fff; font-size: 16px; text-align: center; border-radius: 4px; cursor: pointer; transition: all .1s; }
.gm-option.selected { background: rgba(255,255,255,.4); font-weight: bold; border: 1px solid #fff; }
</style>
</head>
<body>

<div id="mobileBlock"><div style="font-size:60px;margin-bottom:20px;">🚫</div><div style="font-size:20px;font-weight:bold;">手机端玩不了这个</div><div style="margin-top:10px;color:#888;">换电脑来吧，兄弟</div></div>

<div id="startOverlay">
  <div class="title">我的世界 · 网页版</div>
  <button class="startBtn" onclick="startPlayback()">开始游戏</button>
</div>
<div id="introLayer">
  <video id="introVideo" playsinline preload="auto"></video>
  <div id="introSkip" onclick="finishIntro()">跳过 ▶</div>
</div>

<video id="bgVideo" loop playsinline preload="auto"></video>
<div id="bgMask"></div>

<div id="topAvatarBtn" onclick="toggleProfile()">
  <div class="avatar-img" id="topAvatarImg">😀</div>
  <div class="nick-text" id="topNickText">史蒂夫</div>
</div>

<div id="profilePanel" class="panel">
  <h3>👤 个人资料</h3>
  <label>你的游戏昵称</label>
  <input type="text" id="profileNickInput" maxlength="12" placeholder="输入昵称">
  
  <label>头像（点击自带，或下方上传）</label>
  <div class="avatar-picker" id="avatarPicker"></div>
  
  <label>从本地相册上传（存储权限）</label>
  <input type="file" id="avatarUpload" accept="image/*" style="display:none" onchange="handleAvatarUpload(this)">
  <button class="btn-sm" style="width:100%;margin-top:6px;" onclick="document.getElementById('avatarUpload').click()">📂 选择本地图片</button>
  
  <div class="btn-row" style="justify-content:center;margin-top:20px;">
    <button class="btn-sm" onclick="closeProfile()">取消</button>
    <button class="btn-sm green" onclick="saveProfile()">保存修改</button>
  </div>
</div>

<div class="app">
  <div class="screen active" id="screenHome">
    <div class="home-box">
      <div class="home-title">我的世界</div>
      <button class="mc-btn primary" onclick="goScreen('screenSingleplayer')">🌍 单人世界</button>
      <button class="mc-btn" onclick="goScreen('screenMultiplayer')">🌐 多人联机</button>
      <button class="mc-btn" onclick="showAbout()">ℹ️ 这玩意咋用</button>
    </div>
  </div>

  <div class="screen" id="screenSingleplayer">
    <div class="topbar">
      <button class="btn-icon" onclick="goHome()">←</button>
      <h1>单人世界</h1>
      <div style="width:40px"></div>
    </div>
    <div class="list-container" id="worldList"></div>
    <div class="action-bar">
      <button class="btn-sm green" onclick="openCreateWorld()">➕ 新建世界</button>
      <button class="btn-sm" id="btnPlayWorld" onclick="playSelectedWorld()" disabled>▶ 进入世界</button>
      <button class="btn-sm" id="btnOpenLan" onclick="openLanSettings()" disabled>📡 对局域网开放</button>
      <button class="btn-sm danger" id="btnDeleteWorld" onclick="deleteSelectedWorld()" disabled>🗑 删除</button>
    </div>
  </div>

  <div class="screen" id="screenMultiplayer">
    <div class="topbar">
      <button class="btn-icon" onclick="goHome()">←</button>
      <h1>多人联机</h1>
      <div style="width:40px"></div>
    </div>
    <div class="list-container" id="serverList"></div>
    <div class="action-bar">
      <button class="btn-sm green" onclick="openAddServer()">➕ 添加服务器</button>
      <button class="btn-sm" id="btnJoinServer" onclick="joinSelectedServer()" disabled>▶ 进入服务器</button>
    </div>
  </div>
</div>

<div id="gameView">
  <canvas id="gameCanvas"></canvas>
  <div id="crosshair"></div>
  
  <div id="gameHud">
    <div id="gameCoord">X: 0 Y: 0 Z: 0</div>
    <div id="gameMode">模式: 生存</div>
    <div id="gamePing">延迟: ---</div>
  </div>

  <div id="gameChatBox">
    <div id="gameChatHistory"></div>
    <div id="gameChatInputWrap">
      <input type="text" id="gameChatInput" placeholder="输入聊天内容或 /指令，按回车发送...">
    </div>
  </div>

  <div id="gamemodeSwitcher">
    <div class="gm-option" data-mode="0">生存模式</div>
    <div class="gm-option" data-mode="1">创造模式</div>
    <div class="gm-option" data-mode="2">冒险模式</div>
    <div class="gm-option" data-mode="3">旁观模式</div>
  </div>
  
  <div id="pauseMenu">
    <h2>游戏菜单</h2>
    <button onclick="resumeGame()">回到游戏</button>
    <button onclick="saveAndQuit()">保存并退回到标题画面</button>
  </div>

  <div id="inventoryScreen">
    <div class="inv-panel">
      <h3>物品栏</h3>
      <div class="inv-grid" id="invGrid"></div>
      <div class="inv-grid" id="hotbarGrid" style="margin-top:20px;"></div>
    </div>
  </div>

  <div id="hotbar"></div>
</div>

<div class="modal-mask" id="modalCreateWorld">
  <div class="modal">
    <h3>新建世界</h3>
    <label>世界名字</label>
    <input type="text" id="worldNameInput" placeholder="随便起一个" maxlength="30">
    <label>种子（留空就随机）</label>
    <input type="text" id="worldSeedInput" placeholder="不填也行">
    <div class="btn-row">
      <button class="btn-sm" onclick="closeModal('modalCreateWorld')">算了</button>
      <button class="btn-sm green" onclick="doCreateWorld()">开搞</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="modalLan">
  <div class="modal">
    <h3>对局域网开放</h3>
    <div style="color:#8890a0;font-size:12px;line-height:1.6;margin-bottom:16px;">
      只填一个端口号（比如 25565）。朋友在多人联机里输入一模一样的端口号就能进。
    </div>
    
    <label>局域网端口号</label>
    <div style="display:flex; gap:8px;">
      <input type="text" id="lanPortInput" placeholder="例如 25565" maxlength="5" style="flex:1;">
      <button class="btn-sm" onclick="randomLanPort()">🎲 随机</button>
    </div>
    
    <div class="btn-row" style="margin-top:24px;">
      <button class="btn-sm" onclick="closeModal('modalLan')">取消</button>
      <button class="btn-sm green" onclick="doOpenLan()">开启联机</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="modalAddServer">
  <div class="modal">
    <h3>添加服务器</h3>
    <label>给服起个名</label>
    <input type="text" id="addServerName" placeholder="朋友的服" maxlength="20">
    <label>服务器端口</label>
    <input type="text" id="addServerAddr" placeholder="填房主给的端口号">
    <div class="btn-row">
      <button class="btn-sm" onclick="closeModal('modalAddServer')">取消</button>
      <button class="btn-sm green" onclick="doAddServer()">加进去</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ================= 全局变量 =================
if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|HarmonyOS|Mobile/i.test(navigator.userAgent)){
  document.getElementById('mobileBlock').classList.add('show');
  document.getElementById('startOverlay').style.display = 'none';

  try { var mod = await import('https://cdn.jsdelivr.net/npm/trystero@0.21.5/+esm'); if(mod && mod.joinRoom){ joinRoomFn = mod.joinRoom; trysteroReady = true; return true; } } catch(e){}

async function connectToRoom(addr, host){
  var ok = await ensureTrystero();
  if(!ok) return;
  if(currentRoom){ try { currentRoom.leave(); } catch(e){} }

  try {
    currentRoom = joinRoomFn({ appId: 'mc-web-final-v15', rtcConfig: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } }, addr);
  } catch(e){ toast('端口格式有误，无法建立连接'); return; }

  myPeerId = currentRoom.selfId || 'local';

  var pingA = currentRoom.makeAction('ping'); var pongA = currentRoom.makeAction('pong');
  sendPing = pingA[0]; sendPong = pongA[0];
  pingA[1]((d, id) => sendPong({ ts: d.ts }, id));
  pongA[1]((d) => { var rtt = Date.now() - d.ts; document.getElementById('gamePing').textContent = '延迟: ' + rtt + 'ms'; document.getElementById('gamePing').style.color = '#6ee7b7'; });

  var chatA = currentRoom.makeAction('chat'); sendChat = chatA[0];
  chatA[1]((d) => { addGameChatMessage(d.name, d.avatar, d.text); });

  var metaA = currentRoom.makeAction('meta'); sendMeta = metaA[0];
  metaA[1]((d, peerId) => {
    if(remotePlayers[peerId]) { remotePlayers[peerId].name = d.name; remotePlayers[peerId].avatar = d.avatar; }
    if(!remotePlayers[peerId]) { spawnRemotePlayer(peerId, d.name, d.avatar); }
  });

  var posA = currentRoom.makeAction('pos'); sendPos = posA[0];
  posA[1]((d, peerId) => {
    if(remotePlayers[peerId]) { remotePlayers[peerId].mesh.position.copy(d.pos); remotePlayers[peerId].mesh.position.y -= 1.5; remotePlayers[peerId].mesh.rotation.y = d.yaw; }
  });

  currentRoom.onPeerJoin((id) => {
    if(sendMeta) sendMeta({ name: currentNick, avatar: currentAvatar });
    toast('玩家已成功连接！');
  });

  currentRoom.onPeerLeave((id) => {
    if(remotePlayers[id]) { scene.remove(remotePlayers[id].mesh); delete remotePlayers[id]; }
  });

  if(host) setInterval(() => { if(sendPing) sendPing({ ts: Date.now() }); }, 3000);
}

function executeCommand(cmd) {
  var args = cmd.trim().split(/\s+/); var base = args[0].toLowerCase(); var result = '';
  if (base === '/give') { var item = args[1]; if (item) { addGameChatMessage('系统', '😀', '已给予物品: ' + item); result = '成功给予 ' + item; } else { result = '用法: /give <物品名>'; } } 
  else if (base === '/tp') { var x = parseFloat(args[1]), y = parseFloat(args[2]), z = parseFloat(args[3]); if (!isNaN(x) && !isNaN(y) && !isNaN(z)) { playerPos.set(x, y, z); result = '已传送至 ' + x + ', ' + y + ', ' + z; } else { result = '用法: /tp <x> <y> <z>'; } } 
  else if (base === '/setblock') { var x = parseFloat(args[1]), y = parseFloat(args[2]), z = parseFloat(args[3]), blockType = args[4] || 'stone'; if (!isNaN(x) && !isNaN(y) && !isNaN(z)) { addBlock(x, y, z, blockType); result = '已放置方块: ' + blockType; } else { result = '用法: /setblock <x> <y> <z> <方块名>'; } } 
  else if (base === '/help') { result = '可用指令: /give /tp /setblock /help'; } 
  else { result = '未知指令: ' + base; }
  addGameChatMessage('系统', '😀', result);
}

function launchGame(worldName, seed, isMultiplayer){
  if(!renderer) initEngine();
  document.getElementById('gameView').classList.add('show'); gameActive = true;
  
  // 恢复上次退出的位置和视角
  var saved = localStorage.getItem('mc_saved_state');
  if (saved) {
      try {
          var state = JSON.parse(saved);
          playerPos.set(state.x, state.y, state.z);
          yaw = state.yaw;
          pitch = state.pitch;
      } catch(e) {
          playerPos.set(0, 30, 0); // 没存档的话从高空出生
          yaw = 0; pitch = 0;
      }
  } else {
      playerPos.set(0, 30, 0); 
      yaw = 0; pitch = 0;
  }
  
  velocityY = 0; cameraMode = 0;
  document.getElementById('gameCanvas').requestPointerLock(); updateCameraModeText();
}

function initEngine(){
  var canvas = document.getElementById('gameCanvas');
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x87CEEB); scene.fog = new THREE.Fog(0x87CEEB, 30, 60);
  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  raycaster = new THREE.Raycaster(); scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  var dir = new THREE.DirectionalLight(0xffffff, 0.75); dir.position.set(50, 100, 50); scene.add(dir);

  generateWorld(); 
  playerModel = createPlayerModelMesh(); scene.add(playerModel);
  
  // 方块高亮线框
  var geo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.002, 1.002, 1.002)); 
  var mat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }); // MC是黑框
  highlightBox = new THREE.LineSegments(geo, mat); highlightBox.visible = false; scene.add(highlightBox);

  document.addEventListener('keydown', onKeyDown); document.addEventListener('keyup', onKeyUp); document.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('click', onCanvasClick); canvas.addEventListener('mousedown', onCanvasMouseDown); addEventListener('resize', onResize);

  document.getElementById('gameChatInput').addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      var text = e.target.value.trim();
      if(text.startsWith('/')) { executeCommand(text); } 
      else if(text && sendChat) { sendChat({ name: currentNick, avatar: currentAvatar, text: text }); }
      e.target.value = ''; toggleChat(false);
    }
  });
  
  loop();
}

function generateWorld() {
  // 清理旧数据
  blocks.forEach(b => scene.remove(b)); blocks = []; blockMeshes = [];
  
  var half = Math.floor(renderDistance / 2);
  // 生成多区块
  for(var cx = -half; cx <= half; cx++) {
    for(var cz = -half; cz <= half; cz++) {
      generateChunk(cx, cz);
    }
  }
}

function generateChunk(cx, cz) {
  var startX = cx * CHUNK_SIZE;
  var startZ = cz * CHUNK_SIZE;
  
  // 高度图数组
  var heightMap = {};
  
  for(var x = 0; x < CHUNK_SIZE; x++) {
    for(var z = 0; z < CHUNK_SIZE; z++) {
      var wx = startX + x;
      var wz = startZ + z;
      // 生成波浪地形
      var h = Math.floor(Math.sin(wx * 0.1) * 4 + Math.cos(wz * 0.1) * 4 + 12);
      heightMap[x + ',' + z] = h;
      
      // 最底层基岩
      addBlock(wx, 0, wz, 'bedrock');
      
      // 填充泥土和石头
      for(var y = 1; y < h; y++) {
        var type = y === h - 1 ? 'grass_block' : (y > h - 4 ? 'dirt' : 'stone');
        addBlock(wx, y, wz, type);
      }
      
      // 种树
      if (Math.random() < 0.01 && h > 5) { 
        generateTree(wx, h, wz);
      }
    }
  }
}

function generateTree(x, groundY, z) {
  var trunkHeight = 4 + Math.floor(Math.random() * 2); 
  for (var i = 0; i < trunkHeight; i++) {
    addBlock(x, groundY + i, z, 'oak_log');
  }
  
  for (var dx = -2; dx <= 2; dx++) {
    for (var dz = -2; dz <= 2; dz++) {
      for (var dy = 0; dy <= 2; dy++) {
        if (Math.abs(dx) === 2 && Math.abs(dz) === 2) continue; 
        if (dy === 2 && (Math.abs(dx) > 1 || Math.abs(dz) > 1)) continue;
        if (dx === 0 && dz === 0 && dy < 2) continue; 
        
        addBlock(x + dx, groundY + trunkHeight - 1 + dy, z + dz, 'oak_leaves');
      }
    }
  }
}

function addBlock(x, y, z, type){
  var geo = new THREE.BoxGeometry(1, 1, 1); var tex = getTexture(type); var mat = new THREE.MeshLambertMaterial({ map: tex });
  var mesh = new THREE.Mesh(geo, mat); 
  mesh.position.set(x, y, z); 
  mesh.userData = { type: type }; 
  scene.add(mesh); 
  blocks.push(mesh);
}

function createPlayerModelMesh(){
  var group = new THREE.Group(); 
  var tex = textureLoader.load(STEVE_SKIN_URL, undefined, undefined, function(){ tex.image = new Image(); tex.image.src = FALLBACK_TEXTURE; tex.needsUpdate = true; });
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; 
  var bodyMat = new THREE.MeshLambertMaterial({ map: tex });
  
  var body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.75, 0.25), bodyMat); body.position.y = 0.375; group.add(body);
  var head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), bodyMat); head.position.y = 1.0; group.add(head);
  
  var limbMat = new THREE.MeshLambertMaterial({ color: 0x2D2D2D });
  var armL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.75, 0.25), limbMat); armL.position.set(-0.375, 0.375, 0); group.add(armL);
  var armR = armL.clone(); armR.position.x = 0.375; group.add(armR);
  var legL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.75, 0.25), limbMat); legL.position.set(-0.125, -0.375, 0); group.add(legL);
  var legR = legL.clone(); legR.position.x = 0.125; group.add(legR);
  return group;
}

function onKeyDown(e){
  if(!gameActive) return;
  if(isChatting){ if(e.code === 'Escape') toggleChat(false); return; }
  keys[e.code] = true;
  
  if(e.code === 'Escape'){ if(document.pointerLockElement){ document.exitPointerLock(); document.getElementById('pauseMenu').classList.add('show'); } }
  if(e.code === 'F5'){ e.preventDefault(); cameraMode = (cameraMode + 1) % 3; updateCameraModeText(); }
  if(e.code === 'KeyE'){ e.preventDefault(); inventoryOpen = !inventoryOpen; document.getElementById('inventoryScreen').classList.toggle('show', inventoryOpen); if(inventoryOpen && document.pointerLockElement) document.exitPointerLock(); if(!inventoryOpen) document.getElementById('gameCanvas').requestPointerLock(); }
  if(e.code === 'KeyT'){ e.preventDefault(); toggleChat(true); }
  if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') isSneaking = true;
  if(e.code === 'ControlLeft' || e.code === 'ControlRight') isSprinting = true;
  if(e.code.startsWith('Digit') && e.code.length === 6){ var num = parseInt(e.code[5]); if(num >= 1 && num <= 9){ selectedHotbarSlot = num - 1; updateHotbarUI(); } }
}
function onKeyUp(e){
  if(!gameActive) return; keys[e.code] = false;
  if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') isSneaking = false;
  if(e.code === 'ControlLeft' || e.code === 'ControlRight') isSprinting = false;
}
function toggleChat(open){
  isChatting = open; var wrap = document.getElementById('gameChatInputWrap'); var input = document.getElementById('gameChatInput');
  wrap.classList.toggle('show', open);
  if(open){ if(document.pointerLockElement) document.exitPointerLock(); input.focus(); } 
  else { input.blur(); if(!document.pointerLockElement && !inventoryOpen && gameActive && !isGMSwitcherOpen) { document.getElementById('gameCanvas').requestPointerLock(); } }
}
function onMouseMove(e){
  if(!gameActive || !document.pointerLockElement) return; var sensitivity = 0.002;
  yaw -= e.movementX * sensitivity; pitch -= e.movementY * sensitivity; pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, pitch));
}
function onCanvasClick(){
  if(gameActive && !document.pointerLockElement && !inventoryOpen && !isChatting && !isGMSwitcherOpen){ document.getElementById('pauseMenu').classList.remove('show'); document.getElementById('gameCanvas').requestPointerLock(); }
}
function onCanvasMouseDown(e){
  if(!gameActive || !document.pointerLockElement || isChatting || inventoryOpen) return;
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); var hits = raycaster.intersectObjects(blocks);
  if(hits.length > 0 && hits[0].distance < 8){
    var hit = hits[0];
    if(e.button === 0){ scene.remove(hit.object); blocks = blocks.filter(b => b !== hit.object); } 
    else if(e.button === 2){
      var normal = hit.face.normal; var pos = hit.object.position; var newPos = new THREE.Vector3(pos.x + normal.x, pos.y + normal.y, pos.z + normal.z);
      var occupied = blocks.some(b => b.position.distanceTo(newPos) < 0.1); if(!occupied){ addBlock(newPos.x, newPos.y, newPos.z, hotbarBlocks[selectedHotbarSlot]); }
    }
  }
}
function onResize(){ if(renderer){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); } }
function updateCameraModeText(){
  var text = '第一人称'; if(cameraMode === 1) text = '第三人称 (背面)'; if(cameraMode === 2) text = '第三人称 (正面)';
  document.getElementById('gameMode').textContent = '模式: ' + text;
}

// 真正的重力与碰撞物理循环
var lastFrameTime = performance.now();
function loop(){
  requestAnimationFrame(loop); if(!gameActive) return;
  var now = performance.now(); var dt = (now - lastFrameTime) / 1000; lastFrameTime = now;
  
  // 防止切出页面导致巨大物理跳跃
  if (dt > 0.1) dt = 0.1;
  var tickDelta = dt * 20; 
  if (tickDelta > 2) tickDelta = 2; 
  
  var speed = WALK_SPEED; 
  if (isSneaking) speed = SNEAK_SPEED; 
  else if (isSprinting) speed = SPRINT_SPEED;
  
  // 水平移动
  var forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)); var right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  if(keys['KeyW']) playerPos.addScaledVector(forward, speed * dt);
  if(keys['KeyS']) playerPos.addScaledVector(forward, -speed * dt);
  if(keys['KeyA']) playerPos.addScaledVector(right, -speed * dt);
  if(keys['KeyD']) playerPos.addScaledVector(right, speed * dt);

  // 重力下落
  velocityY -= GRAVITY * tickDelta;
  if(velocityY < -50) velocityY = -50; // 终端速度限制
  
  var nextY = playerPos.y + velocityY * tickDelta;
  
  // 射线检测地面碰撞
  var onGround = false;
  var rayStart = new THREE.Vector3(playerPos.x, nextY - 1.5 + 0.1, playerPos.z); // 从脚部往下打
  var rayDir = new THREE.Vector3(0, -1, 0);
  raycaster.set(rayStart, rayDir);
  var hits = raycaster.intersectObjects(blocks);
  
  if (hits.length > 0 && hits[0].distance < Math.abs(velocityY * tickDelta) + 0.1) {
      // 如果脚下有方块，并且距离小于下落距离，说明撞到地面了
      onGround = true;
      playerPos.y = hits[0].point.y + 1.5 - 0.1; // 校准高度 (模型原点在中心)
      velocityY = 0;
  } else {
      playerPos.y = nextY;
  }
  
  // 跳跃
  if(keys['Space'] && onGround){
    velocityY = JUMP_VELOCITY;
    onGround = false;
  }

  // 更新模型位置
  playerModel.position.copy(playerPos); playerModel.position.y -= 1.5; playerModel.rotation.y = yaw;
  if(sendPos && Date.now() - lastPosSendTime > 100) { lastPosSendTime = Date.now(); sendPos({ pos: playerPos, yaw: yaw }); }

  // 相机视角
  if(cameraMode === 0){ camera.position.copy(playerPos); camera.position.y += 0.6; playerModel.visible = false; } 
  else if(cameraMode === 1){ var offset = new THREE.Vector3(Math.sin(yaw) * 4, 2, Math.cos(yaw) * 4); camera.position.copy(playerPos).add(offset); camera.lookAt(playerPos); playerModel.visible = true; } 
  else { var offset = new THREE.Vector3(-Math.sin(yaw) * 4, 2, -Math.cos(yaw) * 4); camera.position.copy(playerPos).add(offset); camera.lookAt(playerPos); playerModel.visible = true; }
  camera.rotation.order = 'YXZ'; camera.rotation.y = yaw; camera.rotation.x = pitch;

  // 方块高亮 (黑框)
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); var targetHits = raycaster.intersectObjects(blocks);
  if(targetHits.length > 0 && targetHits[0].distance < 8){ highlightBox.position.copy(targetHits[0].object.position); highlightBox.visible = true; } else { highlightBox.visible = false; }

  // 更新 HUD
  document.getElementById('gameCoord').textContent = `X: ${playerPos.x.toFixed(1)} Y: ${playerPos.y.toFixed(1)} Z: ${playerPos.z.toFixed(1)}`;
  
  renderer.render(scene, camera);
}

function initHotbarUI(){
  var hotbar = document.getElementById('hotbar'); hotbar.innerHTML = '';
  hotbarBlocks.forEach((type, i) => {
    var slot = document.createElement('div'); slot.className = 'hotbar-slot' + (i === 0 ? ' selected' : '');
    slot.innerHTML = `<span class="slot-num">${i+1}</span><img src="${blockTextures[type]}">`;
    slot.onclick = () => { selectedHotbarSlot = i; updateHotbarUI(); }; hotbar.appendChild(slot);
  });
}
function updateHotbarUI(){ document.querySelectorAll('.hotbar-slot').forEach((slot, i) => { slot.classList.toggle('selected', i === selectedHotbarSlot); }); }
function resumeGame(){ document.getElementById('pauseMenu').classList.remove('show'); document.getElementById('gameCanvas').requestPointerLock(); }
function saveAndQuit(){ 
    saveGameState(); 
    gameActive = false; 
    document.getElementById('gameView').classList.remove('show'); 
    document.getElementById('pauseMenu').classList.remove('show'); 
    document.getElementById('gamePing').style.display = 'none'; 
    if(document.pointerLockElement) document.exitPointerLock(); 
    if(currentRoom){ try { currentRoom.leave(); } catch(e){} currentRoom = null; } 
    goHome(); 
}
function showAbout(){ alert('咋联机？\n\n房主：单人世界 -> 选中一个 -> 对局域网开放。\n\n只需要填一个端口号，朋友在多人联机里输入同样的端口就行。\n\n游戏内快捷键：\nWASD: 移动\n空格: 跳跃\nShift: 潜行\nCtrl: 疾跑\nT: 聊天/指令\nE: 背包\nF5: 切换视角\nF3+F4: 切换游戏模式\n左键: 破坏\n右键: 放置'); }
</script>
