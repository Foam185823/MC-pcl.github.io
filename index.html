<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的世界 · 网页联机大厅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{background:#0f0f14;color:#e8e8f0;height:100vh;overflow:hidden;user-select:none}

/* 移动端拦截 */
#mobileBlock{position:fixed;inset:0;z-index:9999999;background:#0a0a12;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;color:#fff;font-family:monospace}
#mobileBlock.show{display:flex}

/* 开场动画 */
#startOverlay{position:fixed;inset:0;background:#000;z-index:2000000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:30px;transition:opacity .5s}
#startOverlay.hide{opacity:0;pointer-events:none}
#startOverlay .title{font-size:48px;font-weight:900;letter-spacing:8px;background:linear-gradient(135deg,#4a6cf7,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 60px rgba(74,108,247,.5);animation:floatUp 2s ease-in-out infinite}
@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#startOverlay .startBtn{padding:18px 60px;background:linear-gradient(135deg,#3a5cdf,#4a6cf7);color:#fff;border:none;border-radius:50px;font-size:18px;font-weight:700;cursor:pointer;letter-spacing:4px;box-shadow:0 8px 32px rgba(74,108,247,.6);transition:all .3s}
#startOverlay .startBtn:hover{transform:scale(1.05)}

/* 背景 */
#bgVideo{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:0;pointer-events:none;background:#000;opacity:.3}
#bgMask{position:fixed;inset:0;z-index:1;background:radial-gradient(circle at center,rgba(11,12,16,.4),rgba(11,12,16,.85));pointer-events:none}

/* 通用布局 */
.app{width:100vw;height:100vh;position:relative;z-index:2;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;flex:1;padding:30px 40px;overflow-y:auto}
.screen.active{display:flex}
.home-box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;margin:auto}
.home-title{font-size:56px;font-weight:900;text-align:center;letter-spacing:6px;background:linear-gradient(135deg,#6ee7b7,#3b82f6,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:30px}
.mc-btn{width:100%;padding:16px 22px;background:rgba(30,32,48,.85);color:#e8e8f0;border:2px solid rgba(59,130,246,.3);border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;transition:all .3s;letter-spacing:2px;backdrop-filter:blur(12px)}
.mc-btn:hover{transform:translateY(-2px);border-color:#3b82f6;box-shadow:0 12px 40px rgba(59,130,246,.4)}
.mc-btn.primary{background:linear-gradient(135deg,rgba(59,130,246,.9),rgba(110,231,183,.8));border-color:transparent;color:#fff}
.mc-btn.danger{background:rgba(58,28,28,.9);border-color:rgba(255,128,128,.3);color:#ff8080}

/* 列表与卡片 */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-shrink:0}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:1px;color:#fff}
.btn-icon{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#ccc;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.btn-icon:hover{background:rgba(59,130,246,.2);border-color:#3b82f6;color:#fff}
.list-container{flex:1;overflow-y:auto;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(15,15,25,.7);backdrop-filter:blur(20px);padding:12px;max-width:900px;width:100%;margin:0 auto}
.item-card{display:flex;align-items:center;padding:16px;background:rgba(255,255,255,.03);border:2px solid transparent;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.item-card:hover{background:rgba(255,255,255,.06);transform:translateX(4px)}
.item-card.selected{border-color:#3b82f6;background:rgba(59,130,246,.1);box-shadow:0 0 20px rgba(59,130,246,.15)}
.card-icon{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#6ee7b7);display:flex;align-items:center;justify-content:center;font-size:24px;margin-right:16px;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-name{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-desc{font-size:12px;color:#8890a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action-bar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.btn-sm{padding:10px 18px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#ccc;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-sm:hover:not(:disabled){background:rgba(59,130,246,.2);border-color:#3b82f6;color:#fff}
.btn-sm:disabled{opacity:.4;cursor:not-allowed}
.btn-sm.green{background:rgba(110,231,183,.1);border-color:rgba(110,231,183,.3);color:#6ee7b7}

/* 游戏视图 */
#gameView{position:fixed;inset:0;z-index:9999998;background:#000;display:none;cursor:none}
#gameView.show{display:block}
#gameCanvas{width:100%;height:100%;display:block}

/* 准心 */
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;pointer-events:none;z-index:10}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.8)}
#crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}

/* HUD */
#gameHud{position:absolute;top:20px;left:20px;z-index:11;color:#fff;font-family:monospace;font-size:13px;line-height:1.8;text-shadow:0 2px 6px #000;pointer-events:none}
#gamePing{color:#6ee7b7;font-weight:700;margin-top:6px;display:none}
#gameMode{color:#ffaa00;font-weight:700}

/* 暂停菜单 */
#pauseMenu{position:absolute;inset:0;z-index:20;background:rgba(11,12,16,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;cursor:default}
#pauseMenu.show{display:flex}
#pauseMenu h2{color:#fff;font-size:32px;margin-bottom:20px;letter-spacing:4px;font-weight:900}
#pauseMenu button{width:320px;padding:14px;background:rgba(255,255,255,.06);color:#e8e8f0;border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:15px;cursor:pointer;transition:all .2s;font-weight:600}
#pauseMenu button:hover{background:rgba(59,130,246,.2);border-color:#3b82f6;color:#fff}

/* 背包界面 */
#inventoryScreen{position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;cursor:default}
#inventoryScreen.show{display:flex}
.inv-panel{background:rgba(30,30,30,.95);border:4px solid #555;border-radius:8px;padding:20px;width:500px}
.inv-panel h3{text-align:center;margin-bottom:16px;color:#fff;font-size:16px}
.inv-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-bottom:12px}
.inv-slot{aspect-ratio:1;background:rgba(139,139,139,.3);border:2px solid #555;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.inv-slot:hover{border-color:#fff}
.inv-slot.selected{border-color:#fff;box-shadow:0 0 0 2px #fff}
.inv-slot img{width:80%;height:80%;object-fit:contain;image-rendering:pixelated}

/* 快捷栏 */
#hotbar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:11;display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.5);border-radius:8px;border:2px solid rgba(255,255,255,.15)}
.hotbar-slot{width:42px;height:42px;background:rgba(30,30,30,.7);border:2px solid rgba(255,255,255,.2);border-radius:4px;display:flex;align-items:center;justify-content:center;position:relative}
.hotbar-slot.selected{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.4)}
.hotbar-slot img{width:32px;height:32px;object-fit:contain;image-rendering:pixelated}
.hotbar-slot .slot-num{position:absolute;top:1px;left:3px;font-size:10px;color:#aaa}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:600}
.modal-mask.show{display:flex}
.modal{background:rgba(21,22,30,.98);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:28px;width:460px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.modal h3{font-size:18px;color:#fff;margin-bottom:20px;font-weight:800}
.modal label{display:block;font-size:12px;color:#8890a0;margin-bottom:6px;margin-top:14px;font-weight:600}
.modal input{width:100%;background:rgba(15,15,25,.9);color:#e8e8f0;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 14px;font-size:14px;outline:none}
.modal input:focus{border-color:#3b82f6}
.modal .hint{font-size:11px;color:#666;margin-top:6px}
.modal .btn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(60px);background:rgba(30,32,48,.95);backdrop-filter:blur(12px);border:1px solid rgba(59,130,246,.3);border-radius:10px;padding:12px 24px;font-size:13px;color:#e8e8f0;opacity:0;transition:all .3s;pointer-events:none;z-index:999999;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="mobileBlock"><div style="font-size:60px;margin-bottom:20px;">🚫</div><div style="font-size:20px;font-weight:bold;">手机端玩不了这个</div><div style="margin-top:10px;color:#888;">换电脑来吧，兄弟</div></div>

<div id="startOverlay">
  <div class="title">我的世界 · 网页版</div>
  <button class="startBtn" onclick="startPlayback()">开始游戏</button>
</div>

<video id="bgVideo" loop muted playsinline></video>
<div id="bgMask"></div>

<div class="app">
  <div class="screen active" id="screenHome">
    <div class="home-box">
      <div class="home-title">我的世界</div>
      <button class="mc-btn primary" onclick="goScreen('screenSingleplayer')">🌍 单人世界</button>
      <button class="mc-btn" onclick="goScreen('screenMultiplayer')">🌐 多人联机</button>
      <button class="mc-btn" onclick="showAbout()">ℹ️ 这玩意咋用</button>
    </div>
  </div>

  <div class="screen" id="screenSingleplayer">
    <div class="topbar">
      <button class="btn-icon" onclick="goHome()">←</button>
      <h1>单人世界</h1>
      <div style="width:40px"></div>
    </div>
    <div class="list-container" id="worldList"></div>
    <div class="action-bar">
      <button class="btn-sm green" onclick="openCreateWorld()">➕ 新建世界</button>
      <button class="btn-sm" id="btnPlayWorld" onclick="playSelectedWorld()" disabled>▶ 进入世界</button>
      <button class="btn-sm" id="btnOpenLan" onclick="openLanSettings()" disabled>📡 对局域网开放</button>
      <button class="btn-sm danger" id="btnDeleteWorld" onclick="deleteSelectedWorld()" disabled>🗑 删除</button>
    </div>
  </div>

  <div class="screen" id="screenMultiplayer">
    <div class="topbar">
      <button class="btn-icon" onclick="goHome()">←</button>
      <h1>多人联机</h1>
      <div style="width:40px"></div>
    </div>
    <div class="list-container" id="serverList"></div>
    <div class="action-bar">
      <button class="btn-sm green" onclick="openAddServer()">➕ 添加服务器</button>
      <button class="btn-sm" id="btnJoinServer" onclick="joinSelectedServer()" disabled>▶ 进入服务器</button>
    </div>
  </div>
</div>

<!-- 游戏视图 -->
<div id="gameView">
  <canvas id="gameCanvas"></canvas>
  <div id="crosshair"></div>
  <div id="gameHud">
    <div id="gameCoord">X: 0 Y: 0 Z: 0</div>
    <div id="gameMode">模式: 第一人称</div>
    <div id="gamePing">延迟: ---</div>
  </div>
  
  <div id="pauseMenu">
    <h2>游戏菜单</h2>
    <button onclick="resumeGame()">回到游戏</button>
    <button onclick="saveAndQuit()">保存并退回到标题画面</button>
  </div>

  <div id="inventoryScreen">
    <div class="inv-panel">
      <h3>物品栏</h3>
      <div class="inv-grid" id="invGrid"></div>
      <div class="inv-grid" id="hotbarGrid" style="margin-top:20px;"></div>
    </div>
  </div>

  <div id="hotbar"></div>
</div>

<!-- 弹窗 -->
<div class="modal-mask" id="modalCreateWorld">
  <div class="modal">
    <h3>新建世界</h3>
    <label>世界名字</label>
    <input type="text" id="worldNameInput" placeholder="随便起一个" maxlength="30">
    <label>种子（留空就随机）</label>
    <input type="text" id="worldSeedInput" placeholder="不填也行">
    <div class="btn-row">
      <button class="btn-sm" onclick="closeModal('modalCreateWorld')">算了</button>
      <button class="btn-sm green" onclick="doCreateWorld()">开搞</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="modalLan">
  <div class="modal">
    <h3>对局域网开放</h3>
    <div style="color:#8890a0;font-size:12px;line-height:1.6;margin-bottom:16px;">
      把你的映射软件（NatGo / FRP / Sakura）开好，把公网地址粘下面。
    </div>
    <label>映射后的公网地址（IP:端口）</label>
    <input type="text" id="lanAddressInput" placeholder="例如 123.45.67.89:25565 或 xxxx.frp.com">
    <div class="hint">填完点下面，别人拿这个地址就能连你。</div>
    <div class="btn-row">
      <button class="btn-sm" onclick="closeModal('modalLan')">取消</button>
      <button class="btn-sm green" onclick="doOpenLan()">开服！</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="modalAddServer">
  <div class="modal">
    <h3>添加服务器</h3>
    <label>给服起个名</label>
    <input type="text" id="addServerName" placeholder="朋友的服" maxlength="20">
    <label>服务器地址</label>
    <input type="text" id="addServerAddr" placeholder="把房主发的IP粘这儿">
    <div class="btn-row">
      <button class="btn-sm" onclick="closeModal('modalAddServer')">取消</button>
      <button class="btn-sm green" onclick="doAddServer()">加进去</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ================= 全局变量 =================
if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|HarmonyOS|Mobile/i.test(navigator.userAgent)){
  document.getElementById('mobileBlock').classList.add('show');
  document.getElementById('startOverlay').style.display = 'none';
  throw new Error('Mobile Blocked');
}

var worlds = JSON.parse(localStorage.getItem('mc_worlds_v7') || '[]');
var servers = JSON.parse(localStorage.getItem('mc_servers_v7') || '[]');
var selectedWorldIdx = -1, selectedServerIdx = -1;
var currentRoom = null, currentAddress = '', currentNick = localStorage.getItem('mc_nick') || '史蒂夫';
var currentAvatar = localStorage.getItem('mc_avatar') || '😀';
var isHost = false;
var sendChat = null, sendPing = null, sendPong = null;
var joinRoomFn = null, trysteroReady = false;
var myPeerId = '';
var isMuted = false, uiHidden = false;

// 游戏引擎状态
var gameActive = false;
var scene, camera, renderer, raycaster;
var yaw = 0, pitch = 0, keys = {};
var playerPos = new THREE.Vector3(0, 5, 15);
var velocityY = 0, isGrounded = false, isSneaking = false;
var cameraMode = 0; // 0: 第一人称, 1: 第三人称背面, 2: 第三人称正面
var playerModel, highlightBox;
var blocks = []; // 存储所有方块
var selectedHotbarSlot = 0;
var inventoryOpen = false;

// 默认快捷栏方块
var hotbarBlocks = [
  'grass_block', 'dirt', 'stone', 'cobblestone', 'oak_planks',
  'oak_log', 'sand', 'glass', 'bricks'
];

// 方块纹理映射
var blockTextures = {
  'grass_block': 'https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/grass_block.png',
  'dirt': 'https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/dirt.png',
  'stone': 'https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/stone.png',
  'cobblestone': 'https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/cobblestone.png',
  'oak_planks': 'https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/oak_planks.png',
  'oak_log': 'https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/oak_log.png',
  'sand': 'https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/sand.png',
  'glass': 'https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/glass.png',
  'bricks': 'https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/bricks.png'
};

// 史蒂夫皮肤（默认皮肤）
var STEVE_SKIN_URL = 'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/entity/steve.png';

// ================= UI 导航 =================
function goScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id === 'screenSingleplayer') renderWorlds();
  if(id === 'screenMultiplayer') renderServers();
}
function goHome(){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screenHome').classList.add('active');
}
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2500);
}

// ================= 启动动画 =================
window.addEventListener('load', function() {
  renderWorlds();
  renderServers();
  initHotbarUI();
});

function startPlayback(){
  var ov = document.getElementById('startOverlay');
  ov.classList.add('hide');
  setTimeout(() => ov.style.display = 'none', 500);
  
  var bg = document.getElementById('bgVideo');
  bg.src = '背景视频.mp4';
  bg.play().catch(()=>{});
  ensureTrystero();
}

// ================= 单人世界 =================
function renderWorlds(){
  var box = document.getElementById('worldList');
  if(worlds.length === 0){
    box.innerHTML = '<div style="text-align:center;padding:60px;color:#666;">还没开过世界呢，点下面整一个呗</div>';
    return;
  }
  var html = '';
  worlds.forEach((w, i) => {
    html += `<div class="item-card ${i === selectedWorldIdx ? 'selected' : ''}" onclick="selectWorld(${i})" ondblclick="enterWorld(${i})">
      <div class="card-icon">🌍</div>
      <div class="card-info">
        <div class="card-name">${w.name}</div>
        <div class="card-desc">种子: ${w.seed} · 上次玩: ${w.lastPlayed}</div>
      </div>
    </div>`;
  });
  box.innerHTML = html;
}
function selectWorld(i){
  selectedWorldIdx = i;
  renderWorlds();
  document.getElementById('btnPlayWorld').disabled = false;
  document.getElementById('btnOpenLan').disabled = false;
  document.getElementById('btnDeleteWorld').disabled = false;
}
function openCreateWorld(){
  document.getElementById('worldNameInput').value = '';
  document.getElementById('worldSeedInput').value = '';
  document.getElementById('modalCreateWorld').classList.add('show');
}
function doCreateWorld(){
  var name = document.getElementById('worldNameInput').value.trim() || '新的世界';
  var seed = document.getElementById('worldSeedInput').value.trim() || Math.random().toString(36).substring(2, 8);
  worlds.push({ name, seed, lastPlayed: new Date().toLocaleDateString() });
  localStorage.setItem('mc_worlds_v7', JSON.stringify(worlds));
  closeModal('modalCreateWorld');
  selectedWorldIdx = worlds.length - 1;
  renderWorlds();
  toast('世界建好了，进吧');
}
function deleteSelectedWorld(){
  if(selectedWorldIdx < 0) return;
  if(!confirm('删了可就找不回来了，确定？')) return;
  worlds.splice(selectedWorldIdx, 1);
  localStorage.setItem('mc_worlds_v7', JSON.stringify(worlds));
  selectedWorldIdx = -1;
  renderWorlds();
  document.getElementById('btnPlayWorld').disabled = true;
  document.getElementById('btnOpenLan').disabled = true;
  document.getElementById('btnDeleteWorld').disabled = true;
}
function playSelectedWorld(){
  if(selectedWorldIdx >= 0) enterWorld(selectedWorldIdx);
}
function enterWorld(i){
  var w = worlds[i];
  w.lastPlayed = new Date().toLocaleDateString();
  localStorage.setItem('mc_worlds_v7', JSON.stringify(worlds));
  launchGame(w.name, w.seed, false);
}

// ================= 局域网与联机 =================
function openLanSettings(){
  if(selectedWorldIdx < 0) return;
  document.getElementById('lanAddressInput').value = '';
  document.getElementById('modalLan').classList.add('show');
}
async function doOpenLan(){
  var addr = document.getElementById('lanAddressInput').value.trim();
  if(!addr){ toast('得把映射软件给的地址填进来啊'); return; }
  closeModal('modalLan');
  currentAddress = addr;
  currentNick = '房主';
  isHost = true;
  
  toast('正在尝试建立连接...');
  var w = worlds[selectedWorldIdx];
  launchGame(w.name, w.seed, true);
  
  setTimeout(() => {
    connectToRoom(addr, currentNick, true);
    document.getElementById('gamePing').style.display = 'block';
  }, 1200);
}

function renderServers(){
  var box = document.getElementById('serverList');
  if(servers.length === 0){
    box.innerHTML = '<div style="text-align:center;padding:60px;color:#666;">还没添加过服务器，把朋友发的IP粘进来就行</div>';
    return;
  }
  var html = '';
  servers.forEach((s, i) => {
    html += `<div class="item-card ${i === selectedServerIdx ? 'selected' : ''}" onclick="selectServer(${i})" ondblclick="joinServer(${i})">
      <div class="card-icon">🖥️</div>
      <div class="card-info">
        <div class="card-name">${s.name}</div>
        <div class="card-desc">${s.addr}</div>
      </div>
    </div>`;
  });
  box.innerHTML = html;
}
function selectServer(i){
  selectedServerIdx = i;
  renderServers();
  document.getElementById('btnJoinServer').disabled = false;
}
function openAddServer(){
  document.getElementById('addServerName').value = '';
  document.getElementById('addServerAddr').value = '';
  document.getElementById('modalAddServer').classList.add('show');
}
function doAddServer(){
  var name = document.getElementById('addServerName').value.trim() || '兄弟的服';
  var addr = document.getElementById('addServerAddr').value.trim();
  if(!addr){ toast('地址不能空着'); return; }
  servers.push({ name, addr });
  localStorage.setItem('mc_servers_v7', JSON.stringify(servers));
  closeModal('modalAddServer');
  selectedServerIdx = servers.length - 1;
  renderServers();
  toast('服务器加好了');
}
function joinSelectedServer(){
  if(selectedServerIdx >= 0) joinServer(selectedServerIdx);
}
function joinServer(i){
  var s = servers[i];
  currentAddress = s.addr;
  isHost = false;
  connectToRoom(s.addr, currentNick, false);
  launchGame(s.name, 'remote', true);
}

async function ensureTrystero(){
  if(trysteroReady) return true;
  try {
    var mod = await import('https://cdn.jsdelivr.net/npm/trystero@0.21.5/+esm');
    if(mod && mod.joinRoom){ joinRoomFn = mod.joinRoom; trysteroReady = true; return true; }
  } catch(e){}
  return false;
}

async function connectToRoom(addr, nick, host){
  var ok = await ensureTrystero();
  if(!ok) return;
  if(currentRoom){ try { currentRoom.leave(); } catch(e){} }

  try {
    currentRoom = joinRoomFn({
      appId: 'mc-web-ip-direct-v7',
      rtcConfig: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
    }, addr);
  } catch(e){ return; }

  myPeerId = currentRoom.selfId || 'local';

  var pingA = currentRoom.makeAction('ping');
  var pongA = currentRoom.makeAction('pong');
  sendPing = pingA[0]; sendPong = pongA[0];
  pingA[1]((d, id) => sendPong({ ts: d.ts }, id));
  pongA[1]((d) => {
    var rtt = Date.now() - d.ts;
    document.getElementById('gamePing').textContent = '延迟: ' + rtt + 'ms';
    document.getElementById('gamePing').style.color = '#6ee7b7';
  });

  var msgA = currentRoom.makeAction('msg');
  sendChat = msgA[0];
  msgA[1]((d) => console.log(`[${d.sender}]: ${d.text}`));

  currentRoom.onPeerJoin((id) => {
    toast('有人连进来了');
    document.getElementById('gamePing').textContent = '延迟: ---';
  });

  currentRoom.onPeerLeave(() => toast('人走了'));

  if(host) setInterval(() => { if(sendPing) sendPing({ ts: Date.now() }); }, 3000);
}

// ================= 游戏引擎 =================
function launchGame(worldName, seed, isMultiplayer){
  if(!renderer) initEngine();
  document.getElementById('gameView').classList.add('show');
  gameActive = true;
  
  playerPos.set(0, 5, 15);
  velocityY = 0;
  yaw = 0; pitch = 0;
  cameraMode = 0;
  
  document.getElementById('gameCanvas').requestPointerLock();
  updateCameraModeText();
}

function initEngine(){
  var canvas = document.getElementById('gameCanvas');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 30, 80);
  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  raycaster = new THREE.Raycaster();

  // 光照
  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  var dir = new THREE.DirectionalLight(0xffffff, 0.75);
  dir.position.set(50, 100, 50);
  scene.add(dir);

  // 生成地形
  generateTerrain();

  // 创建玩家模型 (史蒂夫)
  createPlayerModel();

  // 创建高亮线框
  var geo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.002, 1.002, 1.002));
  var mat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
  highlightBox = new THREE.LineSegments(geo, mat);
  highlightBox.visible = false;
  scene.add(highlightBox);

  // 事件监听
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);
  document.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('click', onCanvasClick);
  canvas.addEventListener('mousedown', onCanvasMouseDown);
  addEventListener('resize', onResize);
  
  // 全局屏蔽 F5 刷新
  window.addEventListener('keydown', function(e) {
    if(e.key === 'F5' || e.keyCode === 116) {
      e.preventDefault();
      return false;
    }
  });

  loop();
}

function generateTerrain(){
  var geo = new THREE.BoxGeometry(1, 1, 1);
  var size = 16;
  
  for(var x = -size; x < size; x++){
    for(var z = -size; z < size; z++){
      // 简单正弦波地形
      var h = Math.floor(Math.sin(x * 0.3) * 2 + Math.cos(z * 0.3) * 2 + 4);
      for(var y = 0; y < h; y++){
        var type = y === h - 1 ? 'grass_block' : (y > h - 3 ? 'dirt' : 'stone');
        addBlock(x, y, z, type);
      }
    }
  }
}

function addBlock(x, y, z, type){
  var geo = new THREE.BoxGeometry(1, 1, 1);
  var tex = new THREE.TextureLoader().load(blockTextures[type] || blockTextures['stone']);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  var mat = new THREE.MeshLambertMaterial({ map: tex });
  var mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.userData = { type: type, x: x, y: y, z: z };
  scene.add(mesh);
  blocks.push(mesh);
}

function createPlayerModel(){
  playerModel = new THREE.Group();
  
  var tex = new THREE.TextureLoader().load(STEVE_SKIN_URL);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  
  // 身体 (8x12x4 像素 -> 比例 0.5x0.75x0.25)
  var bodyMat = new THREE.MeshLambertMaterial({ map: tex });
  var body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.75, 0.25), bodyMat);
  body.position.y = 0.375;
  playerModel.add(body);

  // 头 (8x8x8 像素 -> 0.5x0.5x0.5)
  var head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), bodyMat);
  head.position.y = 1.0;
  playerModel.add(head);

  // 简单的手脚
  var limbMat = new THREE.MeshLambertMaterial({ color: 0x2D2D2D });
  var arm = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.75, 0.25), limbMat);
  arm.position.set(-0.375, 0.375, 0);
  playerModel.add(arm);
  
  var arm2 = arm.clone();
  arm2.position.x = 0.375;
  playerModel.add(arm2);

  var leg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.75, 0.25), limbMat);
  leg.position.set(-0.125, -0.375, 0);
  playerModel.add(leg);
  
  var leg2 = leg.clone();
  leg2.position.x = 0.125;
  playerModel.add(leg2);
  
  scene.add(playerModel);
}

function onKeyDown(e){
  if(!gameActive) return;
  keys[e.code] = true;

  // ESC 暂停
  if(e.code === 'Escape'){
    if(document.pointerLockElement){
      document.exitPointerLock();
      document.getElementById('pauseMenu').classList.add('show');
    }
  }

  // F5 切换视角
  if(e.code === 'F5'){
    e.preventDefault();
    cameraMode = (cameraMode + 1) % 3;
    updateCameraModeText();
  }

  // E 打开背包
  if(e.code === 'KeyE'){
    e.preventDefault();
    inventoryOpen = !inventoryOpen;
    document.getElementById('inventoryScreen').classList.toggle('show', inventoryOpen);
    if(inventoryOpen && document.pointerLockElement) document.exitPointerLock();
    if(!inventoryOpen) document.getElementById('gameCanvas').requestPointerLock();
  }

  // Shift 潜行
  if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') isSneaking = true;

  // 数字键 1-9 切换物品
  if(e.code.startsWith('Digit') && e.code.length === 6){
    var num = parseInt(e.code[5]);
    if(num >= 1 && num <= 9){
      selectedHotbarSlot = num - 1;
      updateHotbarUI();
    }
  }
}

function onKeyUp(e){
  if(!gameActive) return;
  keys[e.code] = false;
  if(e.code === 'ShiftLeft' || e.code === 'ShiftRight') isSneaking = false;
}

function onMouseMove(e){
  if(!gameActive || !document.pointerLockElement) return;
  var sensitivity = 0.002;
  yaw -= e.movementX * sensitivity;
  pitch -= e.movementY * sensitivity;
  pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, pitch));
}

function onCanvasClick(){
  if(gameActive && !document.pointerLockElement && !inventoryOpen){
    document.getElementById('pauseMenu').classList.remove('show');
    document.getElementById('gameCanvas').requestPointerLock();
  }
}

function onCanvasMouseDown(e){
  if(!gameActive || !document.pointerLockElement) return;
  
  // 射线检测
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  var hits = raycaster.intersectObjects(blocks);
  
  if(hits.length > 0){
    var hit = hits[0];
    
    if(e.button === 0){ // 左键破坏
      scene.remove(hit.object);
      blocks = blocks.filter(b => b !== hit.object);
    } else if(e.button === 2){ // 右键放置
      var normal = hit.face.normal;
      var pos = hit.object.position;
      var newPos = new THREE.Vector3(pos.x + normal.x, pos.y + normal.y, pos.z + normal.z);
      
      // 检查是否已有方块
      var occupied = blocks.some(b => b.position.distanceTo(newPos) < 0.1);
      if(!occupied){
        var blockType = hotbarBlocks[selectedHotbarSlot];
        addBlock(newPos.x, newPos.y, newPos.z, blockType);
      }
    }
  }
}

function onResize(){
  if(renderer){
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
  }
}

function updateCameraModeText(){
  var text = '第一人称';
  if(cameraMode === 1) text = '第三人称 (背面)';
  if(cameraMode === 2) text = '第三人称 (正面)';
  document.getElementById('gameMode').textContent = '模式: ' + text;
}

function loop(){
  requestAnimationFrame(loop);
  if(!gameActive) return;

  // 玩家移动
  var moveSpeed = isSneaking ? 4 : 8;
  var forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  var right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  
  if(keys['KeyW']) playerPos.addScaledVector(forward, moveSpeed * 0.016);
  if(keys['KeyS']) playerPos.addScaledVector(forward, -moveSpeed * 0.016);
  if(keys['KeyA']) playerPos.addScaledVector(right, -moveSpeed * 0.016);
  if(keys['KeyD']) playerPos.addScaledVector(right, moveSpeed * 0.016);

  // 简单的重力
  velocityY -= 9.8 * 0.016;
  playerPos.y += velocityY * 0.016;
  
  // 地面碰撞 (简易)
  if(playerPos.y < 5){
    playerPos.y = 5;
    velocityY = 0;
    isGrounded = true;
  } else {
    isGrounded = false;
  }

  if(keys['Space'] && isGrounded){
    velocityY = 8;
    isGrounded = false;
  }

  // 更新玩家模型位置
  playerModel.position.copy(playerPos);
  playerModel.position.y -= 1.5; // 模型原点在中心，脚在底部
  playerModel.rotation.y = yaw;

  // 根据视角模式设置相机位置
  if(cameraMode === 0){
    // 第一人称
    camera.position.copy(playerPos);
    camera.position.y += 0.6; // 眼睛高度
    playerModel.visible = false;
  } else if(cameraMode === 1){
    // 第三人称背面
    var offset = new THREE.Vector3(Math.sin(yaw) * 4, 2, Math.cos(yaw) * 4);
    camera.position.copy(playerPos).add(offset);
    camera.lookAt(playerPos);
    playerModel.visible = true;
  } else {
    // 第三人称正面
    var offset = new THREE.Vector3(-Math.sin(yaw) * 4, 2, -Math.cos(yaw) * 4);
    camera.position.copy(playerPos).add(offset);
    camera.lookAt(playerPos);
    playerModel.visible = true;
  }

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  // 射线检测高亮
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  var hits = raycaster.intersectObjects(blocks);
  if(hits.length > 0 && hits[0].distance < 8){
    highlightBox.position.copy(hits[0].object.position);
    highlightBox.visible = true;
  } else {
    highlightBox.visible = false;
  }

  // 更新 HUD
  document.getElementById('gameCoord').textContent = `X: ${playerPos.x.toFixed(1)} Y: ${playerPos.y.toFixed(1)} Z: ${playerPos.z.toFixed(1)}`;

  renderer.render(scene, camera);
}

// ================= 快捷栏与背包 UI =================
function initHotbarUI(){
  var hotbar = document.getElementById('hotbar');
  hotbar.innerHTML = '';
  hotbarBlocks.forEach((type, i) => {
    var slot = document.createElement('div');
    slot.className = 'hotbar-slot' + (i === 0 ? ' selected' : '');
    slot.innerHTML = `<span class="slot-num">${i+1}</span><img src="${blockTextures[type]}">`;
    slot.onclick = () => {
      selectedHotbarSlot = i;
      updateHotbarUI();
    };
    hotbar.appendChild(slot);
  });
}

function updateHotbarUI(){
  document.querySelectorAll('.hotbar-slot').forEach((slot, i) => {
    slot.classList.toggle('selected', i === selectedHotbarSlot);
  });
}

// ================= 暂停与退出 =================
function resumeGame(){
  document.getElementById('pauseMenu').classList.remove('show');
  document.getElementById('gameCanvas').requestPointerLock();
}
function saveAndQuit(){
  gameActive = false;
  document.getElementById('gameView').classList.remove('show');
  document.getElementById('pauseMenu').classList.remove('show');
  document.getElementById('gamePing').style.display = 'none';
  if(document.pointerLockElement) document.exitPointerLock();
  if(currentRoom){ try { currentRoom.leave(); } catch(e){} currentRoom = null; }
  goHome();
}

}
