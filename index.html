<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的世界 · 网页联机大厅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{background:#0b0c10;color:#e8e8f0;height:100vh;overflow:hidden}

/* 移动端拦截 */
#mobileBlock{position:fixed;inset:0;z-index:9999999;background:#0a0a12;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;color:#fff;font-family:monospace}
#mobileBlock.show{display:flex}

/* 开场动画 */
#startOverlay{position:fixed;inset:0;background:#000;z-index:2000000;display:none;align-items:center;justify-content:center;flex-direction:column;gap:30px;transition:opacity .5s}
#startOverlay.hide{opacity:0;pointer-events:none}
#startOverlay .title{font-size:48px;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,#6ee7b7,#3b82f6,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 60px rgba(59,130,246,.4)}
#startOverlay .startBtn{padding:16px 50px;background:linear-gradient(135deg,#3b82f6,#6ee7b7);color:#fff;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;letter-spacing:2px;box-shadow:0 8px 32px rgba(59,130,246,.4);transition:all .3s}
#startOverlay .startBtn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(59,130,246,.6)}

/* 背景视频与遮罩 */
#bgVideo{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:0;pointer-events:none;background:#000;opacity:.35}
#bgMask{position:fixed;inset:0;z-index:1;background:radial-gradient(circle at center,rgba(11,12,16,.4),rgba(11,12,16,.85));pointer-events:none}

/* 通用布局 */
.app{width:100vw;height:100vh;position:relative;z-index:2;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;flex:1;padding:30px 40px;overflow-y:auto}
.screen.active{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-shrink:0}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:1px;color:#fff}
.btn-icon{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#ccc;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.btn-icon:hover{background:rgba(59,130,246,.2);border-color:#3b82f6;color:#fff}

/* 主菜单 */
#screenHome{justify-content:center;align-items:center;padding:0}
.home-box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.home-title{font-size:56px;font-weight:900;text-align:center;letter-spacing:6px;background:linear-gradient(135deg,#6ee7b7,#3b82f6,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:30px;filter:drop-shadow(0 4px 20px rgba(59,130,246,.4))}
.mc-btn{width:100%;padding:16px 22px;background:rgba(30,32,48,.85);color:#e8e8f0;border:2px solid rgba(59,130,246,.3);border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;transition:all .3s;letter-spacing:2px;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.mc-btn:hover{transform:translateY(-2px);border-color:#3b82f6;box-shadow:0 12px 40px rgba(59,130,246,.4)}
.mc-btn.primary{background:linear-gradient(135deg,rgba(59,130,246,.9),rgba(110,231,183,.8));border-color:transparent;color:#fff}
.mc-btn.primary:hover{box-shadow:0 16px 50px rgba(59,130,246,.6)}
.mc-btn.danger{background:rgba(58,28,28,.9);border-color:rgba(255,128,128,.3);color:#ff8080}
.mc-btn.danger:hover{background:rgba(90,32,32,.9);box-shadow:0 12px 40px rgba(255,80,80,.4)}

/* 列表容器 */
.list-container{flex:1;overflow-y:auto;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(15,15,25,.7);backdrop-filter:blur(20px);padding:12px;max-width:900px;width:100%;margin:0 auto}
.list-container::-webkit-scrollbar{width:6px}
.list-container::-webkit-scrollbar-thumb{background:rgba(59,130,246,.4);border-radius:3px}

/* 卡片 */
.item-card{display:flex;align-items:center;padding:16px;background:rgba(255,255,255,.03);border:2px solid transparent;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .2s;position:relative}
.item-card:hover{background:rgba(255,255,255,.06);transform:translateX(4px)}
.item-card.selected{border-color:#3b82f6;background:rgba(59,130,246,.1);box-shadow:0 0 20px rgba(59,130,246,.15)}
.card-icon{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#6ee7b7);display:flex;align-items:center;justify-content:center;font-size:24px;margin-right:16px;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-name{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-desc{font-size:12px;color:#8890a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tag{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(110,231,183,.15);color:#6ee7b7;border:1px solid rgba(110,231,183,.3);margin-left:8px}

/* 底部操作栏 */
.action-bar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.btn-sm{padding:10px 18px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#ccc;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-sm:hover:not(:disabled){background:rgba(59,130,246,.2);border-color:#3b82f6;color:#fff}
.btn-sm:disabled{opacity:.4;cursor:not-allowed}
.btn-sm.green{background:rgba(110,231,183,.1);border-color:rgba(110,231,183,.3);color:#6ee7b7}
.btn-sm.green:hover:not(:disabled){background:rgba(110,231,183,.2);box-shadow:0 0 16px rgba(110,231,183,.2)}
.btn-sm.danger{background:rgba(255,128,128,.1);border-color:rgba(255,128,128,.3);color:#ff8080}

/* 游戏视图 */
#gameView{position:fixed;inset:0;z-index:9999998;background:#000;display:none;cursor:none}
#gameView.show{display:block}
#gameCanvas{width:100%;height:100%;display:block}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;pointer-events:none;z-index:10}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.8)}
#crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
#crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
#gameHud{position:absolute;top:20px;left:20px;z-index:11;color:#fff;font-family:monospace;font-size:13px;line-height:1.8;text-shadow:0 2px 6px #000;pointer-events:none}
#gamePing{color:#6ee7b7;font-weight:700;margin-top:6px;display:none}
#gameHint{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);z-index:11;color:rgba(255,255,255,.4);font-size:13px;pointer-events:none}

/* 暂停菜单 */
#pauseMenu{position:absolute;inset:0;z-index:20;background:rgba(11,12,16,.8);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;cursor:default}
#pauseMenu.show{display:flex}
#pauseMenu h2{color:#fff;font-size:32px;margin-bottom:20px;letter-spacing:4px;font-weight:900}
#pauseMenu button{width:320px;padding:14px;background:rgba(255,255,255,.06);color:#e8e8f0;border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:15px;cursor:pointer;transition:all .2s;font-family:inherit;font-weight:600}
#pauseMenu button:hover{background:rgba(59,130,246,.2);border-color:#3b82f6;color:#fff}

/* 快捷栏 */
#inventoryBar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:11;display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.5);border-radius:8px;border:2px solid rgba(255,255,255,.15)}
.inv-slot{width:42px;height:42px;background:rgba(30,30,30,.7);border:2px solid rgba(255,255,255,.2);border-radius:4px;display:flex;align-items:center;justify-content:center;position:relative}
.inv-slot.selected{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.4)}
.inv-slot img{width:32px;height:32px;object-fit:contain;image-rendering:pixelated}
.inv-slot .slot-num{position:absolute;top:1px;left:3px;font-size:10px;color:#aaa;font-family:monospace}

/* 表单弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:600}
.modal-mask.show{display:flex}
.modal{background:rgba(21,22,30,.98);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:28px;width:460px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.modal h3{font-size:18px;color:#fff;margin-bottom:20px;font-weight:800;letter-spacing:1px}
.modal label{display:block;font-size:12px;color:#8890a0;margin-bottom:6px;margin-top:14px;font-weight:600}
.modal input{width:100%;background:rgba(15,15,25,.9);color:#e8e8f0;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:border .2s}
.modal input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.modal .hint{font-size:11px;color:#666;margin-top:6px;line-height:1.5}
.modal .btn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(60px);background:rgba(30,32,48,.95);backdrop-filter:blur(12px);border:1px solid rgba(59,130,246,.3);border-radius:10px;padding:12px 24px;font-size:13px;color:#e8e8f0;opacity:0;transition:all .3s;pointer-events:none;z-index:999999;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="mobileBlock"><div style="font-size:60px;margin-bottom:20px;">🚫</div><div style="font-size:20px;font-weight:bold;">手机端玩不了这个</div><div style="margin-top:10px;color:#888;">换电脑来吧，兄弟</div></div>

<div id="startOverlay">
  <div class="title">我的世界 · 网页版</div>
  <button class="startBtn" onclick="startApp()">开始游戏</button>
</div>

<video id="bgVideo" loop muted autoplay playsinline></video>
<div id="bgMask"></div>

<div class="app">

  <!-- 主菜单 -->
  <div class="screen active" id="screenHome">
    <div class="home-box">
      <div class="home-title">我的世界</div>
      <button class="mc-btn primary" onclick="goScreen('screenSingleplayer')">🌍 单人世界</button>
      <button class="mc-btn" onclick="goScreen('screenMultiplayer')">🌐 多人联机</button>
      <button class="mc-btn" onclick="showAbout()">ℹ️ 这玩意咋用</button>
    </div>
  </div>

  <!-- 单人世界列表 -->
  <div class="screen" id="screenSingleplayer">
    <div class="topbar">
      <button class="btn-icon" onclick="goHome()">←</button>
      <h1>单人世界</h1>
      <div style="width:40px"></div>
    </div>
    <div class="list-container" id="worldList"></div>
    <div class="action-bar">
      <button class="btn-sm green" onclick="openCreateWorld()">➕ 新建世界</button>
      <button class="btn-sm" id="btnPlayWorld" onclick="playSelectedWorld()" disabled>▶ 进入世界</button>
      <button class="btn-sm" id="btnOpenLan" onclick="openLanSettings()" disabled>📡 对局域网开放</button>
      <button class="btn-sm danger" id="btnDeleteWorld" onclick="deleteSelectedWorld()" disabled>🗑 删除</button>
    </div>
  </div>

  <!-- 多人联机列表 -->
  <div class="screen" id="screenMultiplayer">
    <div class="topbar">
      <button class="btn-icon" onclick="goHome()">←</button>
      <h1>多人联机</h1>
      <div style="width:40px"></div>
    </div>
    <div class="list-container" id="serverList"></div>
    <div class="action-bar">
      <button class="btn-sm green" onclick="openAddServer()">➕ 添加服务器</button>
      <button class="btn-sm" id="btnJoinServer" onclick="joinSelectedServer()" disabled>▶ 进入服务器</button>
    </div>
  </div>

</div>

<!-- 游戏视图 -->
<div id="gameView">
  <canvas id="gameCanvas"></canvas>
  <div id="crosshair"></div>
  <div id="gameHud">
    <div id="gameCoord">X: 0 Y: 0 Z: 0</div>
    <div id="gameFps">FPS: --</div>
    <div id="gamePing">延迟: ---</div>
  </div>
  <div id="gameHint">点击画面锁定鼠标 · WASD 移动 · ESC 暂停</div>
  <div id="pauseMenu">
    <h2>游戏菜单</h2>
    <button onclick="resumeGame()">回到游戏</button>
    <button onclick="openInGameSettings()">⚙ 选项</button>
    <button onclick="saveAndQuit()">保存并退回到标题画面</button>
  </div>
  <div id="inventoryBar">
    <div class="inv-slot selected" data-slot="0"><span class="slot-num">1</span><img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/grass_block.png"></div>
    <div class="inv-slot" data-slot="1"><span class="slot-num">2</span><img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/dirt.png"></div>
    <div class="inv-slot" data-slot="2"><span class="slot-num">3</span><img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/stone.png"></div>
    <div class="inv-slot" data-slot="3"><span class="slot-num">4</span><img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/cobblestone.png"></div>
    <div class="inv-slot" data-slot="4"><span class="slot-num">5</span><img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/oak_planks.png"></div>
    <div class="inv-slot" data-slot="5"><span class="slot-num">6</span><img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/oak_log.png"></div>
    <div class="inv-slot" data-slot="6"><span class="slot-num">7</span><img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/sand.png"></div>
    <div class="inv-slot" data-slot="7"><span class="slot-num">8</span><img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/glass.png"></div>
    <div class="inv-slot" data-slot="8"><span class="slot-num">9</span><img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.2/blocks/bricks.png"></div>
  </div>
</div>

<!-- 弹窗们 -->
<div class="modal-mask" id="modalCreateWorld">
  <div class="modal">
    <h3>新建世界</h3>
    <label>世界名字</label>
    <input type="text" id="worldNameInput" placeholder="随便起一个" maxlength="30">
    <label>种子（留空就随机）</label>
    <input type="text" id="worldSeedInput" placeholder="不填也行">
    <div class="btn-row">
      <button class="btn-sm" onclick="closeModal('modalCreateWorld')">算了</button>
      <button class="btn-sm green" onclick="doCreateWorld()">开搞</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="modalLan">
  <div class="modal">
    <h3>对局域网开放</h3>
    <div style="color:#8890a0;font-size:12px;line-height:1.6;margin-bottom:16px;">
      先去把你的映射软件（NatGo / FRP / 花生壳啥的）开好，把生成的公网地址粘下面。端口随便填，别跟别的程序打架就行。
    </div>
    <label>游戏端口</label>
    <div style="display:flex;gap:8px;">
      <input type="text" id="lanPortInput" placeholder="25565" style="flex:1;">
      <button class="btn-sm" onclick="randomPort()" style="padding:0 14px;">🎲</button>
    </div>
    <label>映射后的公网地址（IP:端口）</label>
    <input type="text" id="lanAddressInput" placeholder="例如 123.45.67.89:25565 或 xxxx.frp.com">
    <div class="hint">填完点下面，别人拿这个地址就能连你。</div>
    <div class="btn-row">
      <button class="btn-sm" onclick="closeModal('modalLan')">取消</button>
      <button class="btn-sm green" onclick="doOpenLan()">开服！</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="modalAddServer">
  <div class="modal">
    <h3>添加服务器</h3>
    <label>给服起个名</label>
    <input type="text" id="addServerName" placeholder="朋友的服" maxlength="20">
    <label>服务器地址</label>
    <input type="text" id="addServerAddr" placeholder="把房主发的IP粘这儿">
    <div class="btn-row">
      <button class="btn-sm" onclick="closeModal('modalAddServer')">取消</button>
      <button class="btn-sm green" onclick="doAddServer()">加进去</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ================= 设备检测 =================
if(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|HarmonyOS|Mobile/i.test(navigator.userAgent)){
  document.getElementById('mobileBlock').classList.add('show');
  document.getElementById('startOverlay').style.display = 'none';
  throw new Error('Mobile Blocked');
}

// ================= 全局状态 =================
var worlds = JSON.parse(localStorage.getItem('mc_worlds_v4') || '[]');
var servers = JSON.parse(localStorage.getItem('mc_servers_v4') || '[]');
var selectedWorldIdx = -1, selectedServerIdx = -1;
var currentRoom = null, currentAddress = '', currentNick = localStorage.getItem('mc_nick') || '史蒂夫';
var isHost = false;
var sendChat = null, sendPing = null, sendPong = null;
var pingTimer = null, joinRoomFn = null, trysteroReady = false;
var myPeerId = '';

// ================= 界面导航 =================
function goScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id === 'screenSingleplayer') renderWorlds();
  if(id === 'screenMultiplayer') renderServers();
}
function goHome(){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screenHome').classList.add('active');
}
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2500);
}

// ================= 单人世界 =================
function renderWorlds(){
  var box = document.getElementById('worldList');
  if(worlds.length === 0){
    box.innerHTML = '<div style="text-align:center;padding:60px;color:#666;font-size:14px;">还没开过世界呢，点下面整一个呗</div>';
    return;
  }
  var html = '';
  worlds.forEach((w, i) => {
    html += `<div class="item-card ${i === selectedWorldIdx ? 'selected' : ''}" onclick="selectWorld(${i})" ondblclick="enterWorld(${i})">
      <div class="card-icon">🌍</div>
      <div class="card-info">
        <div class="card-name">${w.name}</div>
        <div class="card-desc">种子: ${w.seed} · 上次玩: ${w.lastPlayed}</div>
      </div>
    </div>`;
  });
  box.innerHTML = html;
}
function selectWorld(i){
  selectedWorldIdx = i;
  renderWorlds();
  document.getElementById('btnPlayWorld').disabled = false;
  document.getElementById('btnOpenLan').disabled = false;
  document.getElementById('btnDeleteWorld').disabled = false;
}
function openCreateWorld(){
  document.getElementById('worldNameInput').value = '';
  document.getElementById('worldSeedInput').value = '';
  document.getElementById('modalCreateWorld').classList.add('show');
}
function doCreateWorld(){
  var name = document.getElementById('worldNameInput').value.trim() || '新的世界';
  var seed = document.getElementById('worldSeedInput').value.trim() || Math.random().toString(36).substring(2, 8);
  worlds.push({ name, seed, lastPlayed: new Date().toLocaleDateString() });
  localStorage.setItem('mc_worlds_v4', JSON.stringify(worlds));
  closeModal('modalCreateWorld');
  selectedWorldIdx = worlds.length - 1;
  renderWorlds();
  toast('世界建好了，进吧');
}
function deleteSelectedWorld(){
  if(selectedWorldIdx < 0) return;
  if(!confirm('删了可就找不回来了，确定？')) return;
  worlds.splice(selectedWorldIdx, 1);
  localStorage.setItem('mc_worlds_v4', JSON.stringify(worlds));
  selectedWorldIdx = -1;
  renderWorlds();
  document.getElementById('btnPlayWorld').disabled = true;
  document.getElementById('btnOpenLan').disabled = true;
  document.getElementById('btnDeleteWorld').disabled = true;
  toast('世界已删除');
}
function playSelectedWorld(){
  if(selectedWorldIdx >= 0) enterWorld(selectedWorldIdx);
}
function enterWorld(i){
  var w = worlds[i];
  w.lastPlayed = new Date().toLocaleDateString();
  localStorage.setItem('mc_worlds_v4', JSON.stringify(worlds));
  launchGame(w.name, w.seed, false);
}

// ================= 局域网开放 =================
function openLanSettings(){
  if(selectedWorldIdx < 0) return;
  document.getElementById('lanPortInput').value = Math.floor(Math.random() * (25600 - 25565 + 1)) + 25565;
  document.getElementById('lanAddressInput').value = '';
  document.getElementById('modalLan').classList.add('show');
}
function randomPort(){
  document.getElementById('lanPortInput').value = Math.floor(Math.random() * (30000 - 20000 + 1)) + 20000;
}
async function doOpenLan(){
  var addr = document.getElementById('lanAddressInput').value.trim();
  if(!addr){
    toast('得把映射软件给的地址填进来啊');
    return;
  }
  closeModal('modalLan');
  currentAddress = addr;
  currentNick = '房主';
  isHost = true;
  
  // 模拟一下权限请求的体感（不真弹窗骚扰，但给个提示）
  toast('正在尝试建立连接...');
  
  var w = worlds[selectedWorldIdx];
  launchGame(w.name, w.seed, true);
  
  setTimeout(() => {
    connectToRoom(addr, currentNick, true);
    document.getElementById('gamePing').style.display = 'block';
  }, 1200);
}

// ================= 多人联机 =================
function renderServers(){
  var box = document.getElementById('serverList');
  if(servers.length === 0){
    box.innerHTML = '<div style="text-align:center;padding:60px;color:#666;font-size:14px;">还没添加过服务器，把朋友发的IP粘进来就行</div>';
    return;
  }
  var html = '';
  servers.forEach((s, i) => {
    html += `<div class="item-card ${i === selectedServerIdx ? 'selected' : ''}" onclick="selectServer(${i})" ondblclick="joinServer(${i})">
      <div class="card-icon">🖥️</div>
      <div class="card-info">
        <div class="card-name">${s.name}</div>
        <div class="card-desc">${s.addr}</div>
      </div>
    </div>`;
  });
  box.innerHTML = html;
}
function selectServer(i){
  selectedServerIdx = i;
  renderServers();
  document.getElementById('btnJoinServer').disabled = false;
}
function openAddServer(){
  document.getElementById('addServerName').value = '';
  document.getElementById('addServerAddr').value = '';
  document.getElementById('modalAddServer').classList.add('show');
}
function doAddServer(){
  var name = document.getElementById('addServerName').value.trim() || '兄弟的服';
  var addr = document.getElementById('addServerAddr').value.trim();
  if(!addr){ toast('地址不能空着'); return; }
  servers.push({ name, addr });
  localStorage.setItem('mc_servers_v4', JSON.stringify(servers));
  closeModal('modalAddServer');
  selectedServerIdx = servers.length - 1;
  renderServers();
  toast('服务器加好了');
}
function joinSelectedServer(){
  if(selectedServerIdx >= 0) joinServer(selectedServerIdx);
}
function joinServer(i){
  var s = servers[i];
  currentAddress = s.addr;
  currentNick = '玩家';
  isHost = false;
  connectToRoom(s.addr, currentNick, false);
  launchGame(s.name, 'remote', true);
}

// ================= WebRTC 联机核心 =================
async function ensureTrystero(){
  if(trysteroReady) return true;
  try {
    var mod = await import('https://cdn.jsdelivr.net/npm/trystero@0.21.5/+esm');
    if(mod && mod.joinRoom){ joinRoomFn = mod.joinRoom; trysteroReady = true; return true; }
  } catch(e){}
  toast('联机组件没加载出来，检查下网络');
  return false;
}

async function connectToRoom(addr, nick, host){
  var ok = await ensureTrystero();
  if(!ok) return;
  if(currentRoom){ try { currentRoom.leave(); } catch(e){} }

  try {
    currentRoom = joinRoomFn({
      appId: 'mc-web-ip-direct-v4',
      rtcConfig: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
    }, addr);
  } catch(e){
    toast('连不上，地址是不是填错了');
    return;
  }

  myPeerId = currentRoom.selfId || 'local';

  // 延迟
  var pingA = currentRoom.makeAction('ping');
  var pongA = currentRoom.makeAction('pong');
  sendPing = pingA[0]; sendPong = pongA[0];
  pingA[1]((d, id) => sendPong({ ts: d.ts }, id));
  pongA[1]((d) => {
    var rtt = Date.now() - d.ts;
    document.getElementById('gamePing').textContent = '延迟: ' + rtt + 'ms';
    document.getElementById('gamePing').style.color = '#6ee7b7';
  });

  // 聊天
  var msgA = currentRoom.makeAction('msg');
  sendChat = msgA[0];
  msgA[1]((d) => addMessage(d.text, d.sender, false));

  currentRoom.onPeerJoin((id) => {
    toast('有人连进来了');
    document.getElementById('gamePing').textContent = '延迟: ---';
    if(host) setInterval(() => { if(sendPing) sendPing({ ts: Date.now() }); }, 3000);
  });

  currentRoom.onPeerLeave(() => {
    toast('人走了');
  });

  if(host){
    // 房主自己也得发个包来测自己的连通性
    setInterval(() => { if(sendPing) sendPing({ ts: Date.now() }); }, 3000);
  }
}

function addMessage(text, sender, isSelf){
  // 简单在游戏里提示一下，不做复杂聊天框了，免得臃肿
  console.log(`[${sender}]: ${text}`);
}

// ================= 游戏引擎 =================
var gameActive = false;
var scene, camera, renderer;
var yaw = 0, pitch = 0, keys = {};
var gameInited = false;
var lastTime = 0;

function launchGame(worldName, seed, isMultiplayer){
  if(!gameInited){ initEngine(); gameInited = true; }
  document.getElementById('gameView').classList.add('show');
  gameActive = true;
  camera.position.set(0, 8, 16);
  yaw = 0; pitch = 0;
  document.getElementById('gameCanvas').requestPointerLock();
  document.getElementById('gameHint').style.display = 'block';
}

function initEngine(){
  var canvas = document.getElementById('gameCanvas');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 30, 80);
  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
  renderer.setSize(innerWidth, innerHeight);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  var dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(50, 100, 50);
  scene.add(dir);

  var geo = new THREE.BoxGeometry(1, 1, 1);
  var mat = new THREE.MeshLambertMaterial({ color: 0x55AA55 });
  for(var x = -12; x < 12; x++){
    for(var z = -12; z < 12; z++){
      var b = new THREE.Mesh(geo, mat);
      b.position.set(x, 0, z);
      scene.add(b);
    }
  }

  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if(e.key === 'Escape' && gameActive){
      if(document.pointerLockElement){
        document.exitPointerLock();
        document.getElementById('pauseMenu').classList.add('show');
      }
    }
  });
  document.addEventListener('keyup', e => keys[e.code] = false);
  document.addEventListener('mousemove', e => {
    if(!gameActive || !document.pointerLockElement) return;
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, pitch));
  });
  canvas.addEventListener('click', () => {
    if(gameActive && !document.pointerLockElement){
      document.getElementById('pauseMenu').classList.remove('show');
      canvas.requestPointerLock();
    }
  });
  addEventListener('resize', () => {
    if(renderer){
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
    }
  });

  loop();
}

function loop(){
  requestAnimationFrame(loop);
  if(!gameActive) return;
  var now = performance.now();
  var dt = (now - lastTime) / 1000;
  lastTime = now;

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  var spd = 8 * dt;
  var fw = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  var rt = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  if(keys['KeyW']) camera.position.addScaledVector(fw, spd);
  if(keys['KeyS']) camera.position.addScaledVector(fw, -spd);
  if(keys['KeyA']) camera.position.addScaledVector(rt, -spd);
  if(keys['KeyD']) camera.position.addScaledVector(rt, spd);
  camera.position.y = Math.max(camera.position.y, 2);

  document.getElementById('gameCoord').textContent = `X: ${camera.position.x.toFixed(1)} Y: ${camera.position.y.toFixed(1)} Z: ${camera.position.z.toFixed(1)}`;

  renderer.render(scene, camera);
}
